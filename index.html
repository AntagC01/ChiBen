<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>YEEEEEHAAAW GOOD STUFF</title>
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <h2>Menu</h2>
        <button>Home</button>
        <button id="btnascension">Ascension</button>
        <button id="btnconquistas">Achievements</button>
        <button id="btnConfig">Settings</button>
    </div>

    <!-- Open/Close Button -->
    <button id="toggleSidebar" class="sidebar-toggle">☰</button>
    <audio src="" autoplay hidden></audio> <!-- Change Music -->

    <!--<img class="img-esquerda" src="img/chicosf.png" height="100px" width="100px">-->
    <!--<img class="img-direita" src="" height="100px" width="100px"> Change image -->

    <div class="conteudo">
        <div>
            <p id="Goiabas">Guavas: 0</p>
            <p id="Goiabasdps">Guavas per second: 0</p>
        </div>
        <div id="rosasdiv">
            <p id="Rosas">Roses: 0</p>
            <p id="Rosasdps">Roses per second: 0</p>
        </div>
        <p>Little Farm</p>
        <button id="Aperta">Click</button>
    </div>

    <div id="listaitens">
        <div class="item">
            <button id="Chico">+1 Chico 10 Guavas</button>
            <p id="Chicos">0 Chicos</p>
            <p id="descchico" class="descricaop">+1 Guavas</p>
        </div>

        <div class="item">
            <button id="Zelele">+1 Ze Lele 100 Guavas</button>
            <p id="Zeleles">0 Ze Leles</p>
            <p id="desczelele" class="descricaop">+7 Guavas</p>
        </div>

        <div class="item">
            <button id="Rosinha">+1 Rosinha 1000 Guavas</button>
            <p id="Rosinhas">0 Rosinhas</p>
            <p desc="descrosinha" class="descricaop">+1 Rosas</p>
        </div>

        <div class="item">
            <button id="cavalo">+1 Cavalo 35 Rosas</button>
            <p id="cavalos">0 Cavalos</p>
            <p id="desccavalo" class="descricaop">+10% Guavas production bonus</p>
        </div>
    </div>

   <div id="upgradeContainer">
    <div id="listaupgrades">
        <button id="Upgrade1" data-tooltip="You collected many guavas and decided to throw a party to boost morale -80 guavas">
            Throw a guava party (2x Chico production)
        </button>

        <button id="Upgrade2" data-tooltip="Now that you have a friend, you both decide to go swimming in the river">
            Jump in the river with Ze Lele (?)
        </button>

        <button id="Upgrade3" data-tooltip="Time to kill those larvae! -500 guavas">
            Spray insecticide to kill guava bugs (2x GBPS)
        </button>

        <button id="Upgrade4" data-tooltip="Give Chico a little gift so he works harder -50 rosas">
            Give roses to Chico (3x GBPS)
        </button>

        <button id="Upgrade5" data-tooltip="Chico has never seen so many little roses, he went crazy">
            Break Chico’s heart (10x GBPS!!!!!!!!!!!!!)
        </button>

        <button id="Upgrade6" data-tooltip="You think a little and decide to double your harvesting speed -30 guavas">
            Pick guavas with both hands (2x guavas per click)
        </button>

        <button id="Upgrade7" data-tooltip="It is a lot easier to just punch the trees -750 guavas">
            Punch the trees (10x guavas per click)
        </button>

        <button id="Upgrade8" data-tooltip="Let's hunt that jaguar">
            Hunt the jaguar that ate Ze Lele (?)
        </button>
    </div>
</div>


    <!-- Floating Window -->
    <div id="configWindow" class="config-window">
        <h3>Settings</h3>
        <label>
            Volume:
            <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
        </label>
        <label>
            <input type="button" id="reset" value="Reset">
        </label>
        <br>
        <button id="closeConfig">Close</button>
    </div>

    <div id="paginaconquistas" class="pagina">
        <h1>ACHIEVEMENTS</h1>
        <h2 id="totalcqtdiv">0 of 7 unlocked</h2>

        <div id="conquistas">
            <button id="cqt1" title="Get 1 guava">First little guava</button>
            <button id="cqt2" title="Get 1 Chico">Cloning Chicos</button>
            <button id="cqt3" title="Get 1 Ze Lele">Best Friend</button>
            <button id="cqt4" title="Jaguar ate Ze Lele">Goodbye best friend :(</button>
            <button id="cqt5" title="Save Ze Lele">Welcome back Ze Lele</button>
            <button id="cqt6" title="Get a Rosinha">First little rose</button>
            <button id="cqt7" title="Have 10 rosinhas">Roses everywhere</button>
        </div>

        <button id="fecharconquistas">Back</button>
    </div>

        <div id="paginaascension" class="pagina">
        <h1>Ascension</h1>
        <h2 id="totalascension">0 Ascensions giving:</h2>

        <div id="ascendbonus">
            <button id="acdbonus1">+0 Start Guavas</button>
            <button id="acdbonus2">+0 GBPS</button>
            <button id="acdbonus3">-0 Scaling cost</button>
            <button id="acdbonus4">+0 Base Click</button>
            <button id="ascend">Ascend</button>
        </div>

        <button id="fecharascension">Back</button>
    </div>

    <div id="conquistaPopup" class="conquista-popup">
        <p id="conquistaTexto">Achievement unlocked!</p>
    </div>

    <!-- Estrutura do alerta -->
    <div id="customAlertOverlay">
    <div id="customAlertBox">
        <p id="customAlertMessage"></p>
        <button onclick="closeCustomAlert()">OK</button>
    </div>
    </div>
    <audio id="audioPlayer" autoplay hidden></audio>
    <script src="script.js"></script>
</body>
</html>
