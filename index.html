<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>AOOOOOOOOOHHHHHH TREM BAO</title>
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <h2>Menu</h2>
        <button>Início</button>
        <button id="btnconquistas">Conquistas</button>
    </div>

    <!-- Botão de abrir/fechar -->
    <button id="toggleSidebar" class="sidebar-toggle">☰</button>
    <audio src="mp3/chico-bento-no-shopping.mp3" autoplay hidden></audio>

    <img class="img-esquerda" src="img/chicosf.png" height="100px" width="100px">
    <img class="img-direita"  src="img/chicosf.png" height="100px" width="100px">

    <div class="conteudo">
        <div style="align-items: center; gap: 10px;">
            <p id="Goiabas">Goiabas: 0</p>
            <p id="Goiabasdps">Goiabas per second: 0</p>
        </div>
        <div id="rosasdiv" style="align-items: center; gap: 10px;">
            <p id="Rosas">Rosas: 0</p>
            <p id="Rosasdps">Rosas per second: 0</p>
        </div>
        <p>Chico bento no</p>
        <p>Shopping</p>
        <button id="Aperta">Aperta</button>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
        <button id="Chico">+1 Chico 10 Goiabas</button>
        <p id="Chicos">0 Chicos</p>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
        <button id="Zelele">+1 Ze lele 100 Goiabas</button>
        <p id="Zeleles">0 Ze leles</p>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
        <button id="Rosinha">+1 Rosinha 1000 Goiabas</button>
        <p id="Rosinhas">0 Rosinhas</p>
    </div>

    <div id="listaupgrades">
        <button id="Upgrade1" title="Você pegou muitas goiabas e decide fazer uma festa para aumentar a moral">Fazer uma festa de goiabas (2x Producao Chico)</button>
        <button id="Upgrade2" title="Agora que você tem um amigo vocês decidem ir no rio juntos">Pular no rio com o Ze lele (?)</button>
        <button id="Upgrade3" title="Bora matar essas larva!">Passar inseticida pra matar os bichos da goiaba (2x GBPS)</button>
        <button id="Upgrade4" title="Dar um agradinho para o Chico trapalhar mais">Dar rosas para o Chico (3x GBPS)</button>
        <button id="Upgrade5" title="Chico nunca viu tanta rosinha na vida, ficou biruta">Iludir o coração do chico (10x GBPS!!!!!!!!!!!!!)</button>
        <button id="Upgrade6" title="Você pensa um pouquinho e acaba por dobrar a sua coleta">Pegar Goiaba com as duas mãos (2x goiabas por click)</button>
        <button id="Upgrade7" title="Descricao vai aqui">Dar soco nas arvores (10x goiabas por click)</button>
        <button id="Upgrade8" title="Vamo pega aquela lambaia">Cacar a onca que comeu o ze lele (?)</button>
    </div>


    <!-- Botão de Configurações -->
    <button id="btnConfig">⚙️ Configurações</button>

    <!-- Janela Flutuante -->
    <div id="configWindow" class="config-window">
        <h3>Configurações</h3>
        <label>
            Volume:
            <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
        </label>
        <label>
            <input type="button" id="reset" value="Reset">
        </label>
        <br>
        <button id="closeConfig">Fechar</button>
    </div>



    <div id="paginaconquistas" class="pagina">
    <h1>CONQUISTAS</h1>
    <h2 id="totalcqtdiv">0 de 7 alcançadas</h2>
    <div id="conquistas">
        <button id="cqt1" title="Consiga 1 goiaba">Primeira goiabinha</button>
        <button id="cqt2" title="Consiga 1 chico">Clonando chicos</button>
        <button id="cqt3" title="Consiga 1 ze lele">Melhor Amigo</button>
        <button id="cqt4" title="Onca comeu o ze lele">Tchau melhor amigo :(</button>
        <button id="cqt5" title="Salve o ze lele">Bem vindo de volta Ze lele</button>
        <button id="cqt6" title="Consiga uma rosinha">Primeira rosinha</button>
        <button id="cqt7" title="Tenha 10 rosinhas">Rosinha pra mais de metro</button>
    </div>

    <button id="fecharconquistas">Voltar</button>
    </div>

    <div id="conquistaPopup" class="conquista-popup">
    <p id="conquistaTexto">Conquista desbloqueada!</p>
    </div>


    <audio id="audioPlayer" autoplay hidden></audio>
    <script src="script.js"></script>
</body>
</html>
