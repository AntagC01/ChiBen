<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>AOOOOOOOOOHHHHHH TREM BAO</title>
</head>
<body>

    <audio src="mp3/chico-bento-no-shopping.mp3" autoplay hidden></audio>

    <img class="img-esquerda" src="img/chicosf.png" height="100px" width="100px">
    <img class="img-direita"  src="img/chicosf.png" height="100px" width="100px">

    <div class="conteudo">
        <div style="align-items: center; gap: 10px;">
            <p id="Goiabas">Goiabas: 0</p>
            <p id="Goiabasdps">Goiabas per second: 0</p>
        </div>
        <p>Chico bento no</p>
        <p>Shopping</p>
        <button id="Aperta">Aperta</button>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
        <button id="Chico">+1 Chico 10 Goiabas</button>
        <p id="Chicos">0 Chicos</p>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
        <button id="Rosinha">+1 Rosinha 100 Goiabas</button>
        <p id="Rosinhas">0 Rosinhas</p>
    </div>


    <!-- Botão de Configurações -->
    <button id="btnConfig">⚙️ Configurações</button>

    <!-- Janela Flutuante -->
    <div id="configWindow" class="config-window">
        <h3>Configurações</h3>
        <label>
            Volume:
            <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
        </label>
        <label>
            <input type="button" id="reset" value="reset">
        </label>
        <br>
        <button id="closeConfig">Fechar</button>
    </div>

    <audio id="audioPlayer" autoplay hidden></audio>

    <script src="script.js"></script>
</body>
</html>
